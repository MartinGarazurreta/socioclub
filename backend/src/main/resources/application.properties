spring.application.name=socioclub

# ---------- Conexión a MySQL ----------
# La base "socioclub" tiene que existir (CREATE DATABASE socioclub;)
spring.datasource.url=jdbc:mysql://localhost:3306/socioclub?serverTimezone=America/Argentina/Cordoba
# Usuario propio del TP (no root), solo con permisos sobre la base socioclub (ver README)
spring.datasource.username=socioclub
spring.datasource.password=socioclub

# ---------- JPA / Hibernate ----------
# update: crea las tablas a partir de las entidades y las actualiza si cambian, sin borrar datos
spring.jpa.hibernate.ddl-auto=update
# Muestra en la consola el SQL que genera Hibernate (útil para explicar el ORM)
spring.jpa.show-sql=true

# ---------- Datos iniciales ----------
# Ejecuta data.sql en cada arranque, después de que Hibernate cree las tablas
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true
